{% extends 'app/base.html' %}
{% load static %}
{% block content %}
<h2>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Split Exercise</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'split_exercise_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
