{% extends 'app/base.html' %}

{% block content %}
<h2>{% if split %}Edit{% else %}Create New{% endif %} Split</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">
        {% if split %}Update{% else %}Create{% endif %}
    </button>
</form>

<a href="{% url 'split_list' %}" class="btn btn-secondary mt-3">Back to List</a>
{% endblock %}
