{% extends 'app/base.html'%}
{% load static %}
{% block content%}

<h2>Are you sure you want to delete "{{ exercise.name }}"?</h2>
<div class="form-group">
<form method="post">
    {% csrf_token %}
    <button type="submit"class="btn btn-danger" >Yes, Delete</button>
</form>
<a href="{% url 'exercise_list' %}">Cancel</a>
</div>
{% endblock %}
