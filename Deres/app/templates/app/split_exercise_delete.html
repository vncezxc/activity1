{% extends 'app/base.html' %}
{% load static %}
{% block content %}
<h2>Are you sure you want to delete "{{ split_exercise.exercise.name }}" from "{{ split_exercise.split.split_name }}"?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'split_exercise_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
