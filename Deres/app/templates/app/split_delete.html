{% extends 'app/base.html' %}

{% block content %}
<h2>Are you sure you want to delete the split "{{ split.split_name }}"?</h2>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
</form>

<a href="{% url 'split_list' %}" class="btn btn-secondary">Cancel</a>
{% endblock %}
